services:

  elb:
    image: haproxy
    ports:
        - "8100:8100"
    volumes:
        - ./haproxy:/usr/local/etc/haproxy
    networks:
      - shared-network
  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=BoilerPlate
      - LOG_LEVEL=DEBUG
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - HOSTNAME=api_service-1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shared-network
  api-2:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app
    ports:
      - "8001:8000"
    environment:
      - APP_NAME=BoilerPlate
      - LOG_LEVEL=DEBUG
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - HOSTNAME=api_service-2
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shared-network
  api-3:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app
    ports:
      - "8002:8000"
    environment:
      - APP_NAME=BoilerPlate
      - LOG_LEVEL=DEBUG
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - HOSTNAME=api_service-3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shared-network
    
    
    

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slack_db
    ports:
    - "5440:5432"

    volumes:
      - db_postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "password"]
    volumes:
      - redis_data:/data
    networks:
      - shared-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5673:5672"  # RabbitMQ port for messaging
      - "15675:15672"  # RabbitMQ Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 13s
      timeout: 10s
      retries: 5
      start_period: 6s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    networks:
      - shared-network
  
  celery:
    build:
      context: .
      dockerfile: Dockerfile.celery
    volumes:
    - ./app:/app
    environment:
      - APP_NAME=BoilerPlateCelery
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - shared-network
    

networks:
  shared-network:
    # external: true
    driver: bridge
  
volumes:
  db_postgres_data:
  redis_data:
  rabbitmq_data:
  rabbitmq_logs:
  elasticsearch-data:  

